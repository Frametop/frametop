name: ARM64 release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install ARM64 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build curl unzip pkg-config \
            libjsoncpp-dev libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev
      - name: Fetch pinned OpenVR ARM64 API library
        run: |
          mkdir -p build/openvr
          curl -fL https://raw.githubusercontent.com/ValveSoftware/openvr/0924064316de3effbcd1acf1e309182a2deb1c05/bin/linuxarm64/libopenvr_api.so \
            -o build/openvr/libopenvr_api.so
          echo 'cc3671d24dd23fb61494e8a8327cf4fe7f638a60508ff7225984a03f2f5947e9  build/openvr/libopenvr_api.so' | sha256sum -c
      - name: Build and run offline tests
        env:
          OPENVR_LIB: ${{ github.workspace }}/build/openvr
        run: bash scripts/build.sh
      - name: Check binary architecture and external libraries
        run: |
          file hands/build/fh-camd hands/build/fh-hands renderer/build/framehands-view pointer/build/fh-input pointer/build/driver_fh_pointer.so
          for bin in hands/build/fh-camd hands/build/fh-hands renderer/build/framehands-view pointer/build/fh-input pointer/build/driver_fh_pointer.so; do
            readelf -h "$bin" | grep -q AArch64
          done
          ! ldd renderer/build/framehands-view | grep -q 'not found'
          ! ldd hands/build/fh-hands | grep -q 'not found'
      - name: Package release
        run: bash scripts/package.sh dist
      - name: Upload workflow artifact
        if: github.ref_type != 'tag'
        # actions/upload-artifact@v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: framehands-aarch64
          path: dist/
      - name: Create draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "FrameHands $GITHUB_REF_NAME" \
            --notes 'Standalone Steam Frame hand tracking. Hardware verification is required.' \
            dist/framehands-aarch64.tar.gz dist/SHA256SUMS
