# Values are read at service startup. Change them with: framehands restart
AUTO_START=1
TRACKING=1
RENDER=1
GESTURE_INPUT=0
HANDS_POINTER_SMOOTH=1
# Optional pinch sensitivity (metres); 0.025 is more forgiving than the old 0.020.
HANDS_PINCH_BEGIN=0.025
# Optional near-contact dip detection: can catch fast taps but risks false clicks.
HANDS_PINCH_DIP=0
CONTROLLER_EMULATION=0
HANDS_MODEL=latest
HANDS_VIEW_MODEL=asset
HANDS_VIEW_STYLE=ghost
HANDS_VIEW_ROOMVIEW=1
HANDS_CAMERAS=auto
HANDS_BRIGHT=all
PERFORMANCE=balanced
HANDS_FLAG_BUFFER=0
DEBUG=0
