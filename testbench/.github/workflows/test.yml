name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install optional MCP SDK and package
        run: python -m pip install -e '.[mcp]'
      - name: Build and test without a headset
        run: make test
