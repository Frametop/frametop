[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-testbench"
version = "0.1.0"
description = "Steam Frame virtual input, compositor capture, and stdio MCP tools"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]

[project.scripts]
frame-testbench = "frame_testbench.cli:main"
frame-testbench-mcp = "frame_testbench.mcp_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["frame_testbench"]
namespaces = true
